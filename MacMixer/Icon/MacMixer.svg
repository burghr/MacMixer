    <!-- knob shadows -->
    <rect x="225" y="578" width="150" height="56" rx="28" fill="#1B2A6B" fill-opacity="0.18"/>
    <rect x="437" y="398" width="150" height="56" rx="28" fill="#1B2A6B" fill-opacity="0.18"/>
    <rect x="649" y="618" width="150" height="56" rx="28" fill="#1B2A6B" fill-opacity="0.18"/>

    <!-- knobs -->
    <rect x="225" y="572" width="150" height="56" rx="28" fill="#FFFFFF"/>
